  # =========================================================================
  # B. OSM GENERATION POLICY
  # =========================================================================
  osm_generation_policy:
    description: |
      OSM candidates are generated only from documented real anchors.
      No random global bboxes without anchor justification.

    anchor_types_allowed: [osm_bbox, osm_place]
    forbidden: random_bbox_without_anchor

    variant_types:
      - exact
      - offset_n
      - offset_e
      - offset_s
      - offset_w

    window_sizes_m: [500, 1000, 1500, 2500, 5000]

    window_size_by_expected_use:
      urban: [500, 1000, 1500, 2500]
      campus: [500, 1000, 1500]
      vehicular: [1000, 2500, 5000]
      rural: [2500, 5000]
      trails: [2500, 5000]
      partitioned: [1000, 2500, 5000]
      corridor: [1000, 2500, 5000]

    offset_distances_m: [0, 200, 500, 1000, 1500]
    max_offset_from_anchor_m: 2000

    stable_seed:
      function: sha256
      formula: "sha256(seed::anchor_id::variant_type::window_size_m::offset_m)[:8] as int"
      global_seed_default: 42

    required_metadata_fields:
      - anchor_id
      - anchor_distance_m
      - window_size_m
      - variant_type
      - center_lat
      - center_lon
      - crs
      - network_type
      - stable_seed

    variants_per_anchor_per_batch: 3

  # =========================================================================
  # C. SYNTHETIC GENERATION POLICY
  # =========================================================================
  synthetic_generation_policy:
    description: |
      Controlled synthetic topology generators complement OSM anchors.
      Trace-reference anchors (INFOCOM, Haggle contacts) produce synthetics only.

    stable_seed:
      function: sha256
      formula: "sha256(seed::generator_id::param_hash::batch_id)[:8] as int"

    generators:
      - generator_id: grid
        archetype: urban_grid
        parameters:
          grid_rows: [8, 10, 12, 15, 18, 20]
          grid_cols: [8, 10, 12, 15, 18, 20]
          block_size_m: [40, 60, 80, 100, 120]
          diagonal_links: [false, true]
        variants_per_batch: 8
        expected_topology:
          gridness_score_min: 0.80
          n_components: 1
        why_needed: Regular orthogonal baseline for vehicle/grid routing behaviour.
        inspiration: Manhattan-style planned grids; synthetic control for gridness.

      - generator_id: jittered_grid
        archetype: dense_urban_irregular
        parameters:
          grid_rows: [8, 12, 15, 18]
          grid_cols: [8, 12, 15, 18]
          block_size_m: [40, 60, 80, 100]
          jitter_m: [0, 5, 10, 20, 30]
          diagonal_links: [false, true]
        variants_per_batch: 8
        expected_topology:
          gridness_score_range: [0.45, 0.75]
          orientation_entropy_min: 0.50
        why_needed: Urban irregularity between perfect grid and organic OSM.
        inspiration: HelsinkiDowntown-like irregular street cores.

      - generator_id: radial_city
        archetype: radial_city
        parameters:
          n_rings: [3, 4, 5, 6, 7, 8]
          n_spokes: [6, 8, 10, 12, 14, 16]
          ring_spacing_m: [80, 100, 120, 150, 200]
          radial_noise_m: [0, 5, 10, 20]
        variants_per_batch: 6
        expected_topology:
          radial_score_min: 0.60
          avg_degree_range: [2.5, 4.0]
        why_needed: Hub-ring urban structure not captured by grids alone.
        inspiration: European radial city plans.

      - generator_id: hub_and_spoke
        archetype: hub_and_spoke
        parameters:
          n_hubs: [1, 2, 3]
          spokes_per_hub: [4, 6, 8, 10, 12]
          hub_spacing_m: [200, 400, 600, 800]
          spoke_length_m: [150, 300, 500, 700]
        variants_per_batch: 6
        expected_topology:
          radial_score_min: 0.40
          dead_end_ratio_min: 0.15
        why_needed: Sparse hub connectivity patterns for DTN hotspot behaviour.
        inspiration: Transit hubs, airport periphery road patterns.

      - generator_id: corridor
        archetype: corridor_linear
        parameters:
          length_m: [2000, 3000, 4000, 5000, 6000, 8000]
          width_m: [400, 600, 800, 1000, 1200]
          branch_prob: [0.0, 0.1, 0.2, 0.3]
          branch_length_m: [100, 200, 400, 600]
        variants_per_batch: 6
        expected_topology:
          corridor_score_min: 0.70
          aspect_ratio_min: 2.5
        why_needed: Linear mobility corridors (highways, arterials, bus routes).
        inspiration: SF Mission corridor; RollerNet sparse mobility.

      - generator_id: tree_trails
        archetype: sparse_trails
        parameters:
          branch_factor: [2, 3]
          depth: [3, 4, 5, 6]
          edge_length_m: [80, 120, 200, 300]
          trail_jitter_m: [0, 10, 20, 40]
        variants_per_batch: 6
        expected_topology:
          dead_end_ratio_min: 0.30
          avg_degree_max: 2.5
        why_needed: Tree-structured trail networks with high dead-end ratio.
        inspiration: Nuuksio-style forest trails.

      - generator_id: sparse_rural
        archetype: rural_roads
        parameters:
          n_nodes: [20, 30, 40, 50, 60, 70, 80]
          connection_radius_m: [200, 400, 600, 800]
          long_edge_prob: [0.1, 0.2, 0.3, 0.4]
          pos_noise_m: [0, 20, 50]
        variants_per_batch: 6
        expected_topology:
          road_density_max: 0.0003
          diameter_approx_min_m: 1500
        why_needed: Sparse rural connectivity with long edges.
        inspiration: Lapland rural OSM; opportunistic sparse contacts.

      - generator_id: clustered_communities
        archetype: clustered_communities
        parameters:
          n_clusters: [3, 4, 5, 6, 7, 8]
          nodes_per_cluster: [8, 12, 16, 20, 25]
          intra_density: [0.5, 0.7, 0.9]
          inter_gap_m: [100, 200, 300, 500]
          inter_bridge_count: [0, 1, 2, 3]
        variants_per_batch: 6
        expected_topology:
          community_score_min: 0.55
          partition_score_min: 0.10
        why_needed: Social/community cluster topology with sparse inter-links.
        inspiration: Haggle contact density; Kallio community structure.

      - generator_id: partitioned_bridge
        archetype: island_or_partitioned
        parameters:
          n_partitions: [2, 3, 4]
          nodes_per_partition: [15, 25, 40, 60]
          intra_density: [0.4, 0.6, 0.8]
          bridges_per_pair: [1, 2, 3]
        variants_per_batch: 5
        expected_topology:
          n_components_min: 2
          partition_score_min: 0.15
        why_needed: Explicit multi-component topology with bridge edges.
        inspiration: Helsinki archipelago; island_or_partitioned OSM.

      - generator_id: disrupted_grid
        archetype: industrial_disrupted
        parameters:
          grid_rows: [10, 12, 15, 18]
          grid_cols: [10, 12, 15, 18]
          block_size_m: [60, 80, 100]
          removal_rate: [0.05, 0.10, 0.15, 0.20, 0.25]
          removal_mode: [random, articulation_bias]
        variants_per_batch: 5
        expected_topology:
          articulation_points_min: 5
          largest_component_ratio_min: 0.70
        why_needed: Infrastructure disruption on otherwise regular topology.
        inspiration: HelsinkiDisrupted; disaster scenarios.

      - generator_id: conference_event_compact
        archetype: conference_event_compact
        parameters:
          hall_count: [2, 3, 4, 5]
          rooms_per_hall: [4, 6, 8, 10]
          corridor_width_m: [8, 12, 16]
          room_spacing_m: [15, 20, 25, 30]
          inter_hall_gap_m: [30, 50, 80]
        variants_per_batch: 5
        expected_topology:
          diameter_approx_max_m: 600
          community_score_min: 0.60
        why_needed: Compact event venue topology from contact-trace literature.
        inspiration: INFOCOM/Info5; conference_event_compact trace reference.

      - generator_id: campus_compact
        archetype: campus_compact
        parameters:
          n_buildings: [6, 8, 10, 12, 15]
          building_spacing_m: [40, 60, 80, 100]
          ring_roads: [1, 2]
          path_density: [0.4, 0.6, 0.8]
          quad_size_m: [200, 300, 400, 500]
        variants_per_batch: 5
        expected_topology:
          useful_area_ratio_min: 0.35
          avg_degree_range: [2.0, 3.5]
        why_needed: Institutional campus layout distinct from urban grid.
        inspiration: Kumpula; MIT Reality Mining campus.

      - generator_id: bus_route_corridor
        archetype: bus_route_urban_suburban
        parameters:
          corridor_length_m: [2000, 3000, 4000, 5000]
          corridor_width_m: [200, 400, 600]
          n_stops: [4, 6, 8, 10, 12]
          feeder_branch_prob: [0.0, 0.2, 0.4]
          n_parallel_lanes: [1, 2]
        variants_per_batch: 5
        expected_topology:
          corridor_score_min: 0.55
          dead_end_ratio_max: 0.20
        why_needed: Bus arterial topology for vehicular DTN scenarios.
        inspiration: DieselNet/PVTA Amherst bus routes.

    trace_reference_mapping:
      infocom_event_compact: conference_event_compact
      infocom_2006_trace: conference_event_compact
      rollernet_trace: corridor
      haggle_contacts_only: clustered_communities

  # =========================================================================
  # D. BATCH GENERATION POLICY
  # =========================================================================
  batch_generation_policy:
    description: |
      Maps are generated in batches. The final candidate count N is determined
      by feature-space saturation, not by a fixed preset number.

    batch_sizes: [100, 200, 400, 600, 800, 1000, 1200, 1600, 2000]
    default_stop_candidates: [400, 600, 800, 1000, 1200, 1600, 2000]
    min_valid_maps_before_stop_check: 200
    min_batches_before_stop_check: 2

    batch_composition:
      osm_fraction: 0.50
      synthetic_fraction: 0.50
      stratify_by: [anchor_id, archetype, source_type]

    saturation_metrics:
      - id: n_valid_maps
        description: Count of maps passing validation (PASS or WARNING)
      - id: n_unique_feature_vectors
        description: Count after deduplication on quantized feature vector
        dedup_tolerance: 1e-6
      - id: n_clusters
        description: Number of clusters in normalized feature space (e.g. k-medoids sweep)
        method: kmedoids_sweep
      - id: mean_nearest_selected_distance
        description: Mean L2 distance from each valid map to nearest selected representative
      - id: max_nearest_selected_distance
        description: Max L2 distance from any valid map to nearest selected representative
      - id: convex_hull_volume_proxy
        description: Product of feature-axis ranges covered by valid maps (normalized)
        optional: true
      - id: coverage_by_archetype
        description: Fraction of declared archetypes with at least one valid map
      - id: coverage_by_source_type
        description: Fraction of osm vs synthetic vs trace_reference_synthetic represented
      - id: improvement_over_previous_batch
        description: Relative delta of n_unique_feature_vectors and max_nearest_selected_distance

    stop_rule:
      description: |
        Generation may stop after at least min_batches_before_stop_check batches
        AND at least min_valid_maps_before_stop_check valid maps, when ALL of
        the following hold for two consecutive batches:

      consecutive_batches_required: 2
      conditions:
        - id: new_clusters_relative_gain
          metric: n_clusters
          threshold_relative: 0.05
          comparison: less_than
          description: Increment of new clusters < 5% relative to previous batch

        - id: max_distance_reduction
          metric: max_nearest_selected_distance
          threshold_relative: 0.05
          comparison: less_than
          description: Reduction of max distance to medoid/representative < 5%

        - id: archetype_coverage_stable
          metric: coverage_by_archetype
          threshold_absolute: 0.0
          comparison: unchanged
          description: Archetype coverage set does not change between batches

        - id: invalid_maps_no_new_regions
          metric: invalid_contribution
          threshold_absolute: 0
          comparison: no_new_valid_regions
          description: Invalid maps do not open new valid feature-space regions

      final_n_claim: >
        The generation stopped at N candidates because the coverage of the
        declared map-topology feature space reached saturation under the
        defined metrics and stop rule.

    claims:
      allowed:
        - explicit map-topology design space
        - real-trace-inspired map anchors
        - OSM-based real map anchors
        - synthetic topology generators
        - feature-space diversity
        - saturation-based stop criterion
        - scenario generation over saturated-selected maps
      forbidden:
        - all possible situations on Earth
        - all possible real-world maps
        - complete representation of reality
        - mathematically complete Earth coverage
