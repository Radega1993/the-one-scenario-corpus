# ===========================================================================
# map_design_space_saturation_v1.yaml
# ===========================================================================
# Formal map-topology design space for batch generation with saturation stop.
# The final number of maps N is determined by feature-space saturation,
# not by manual intuition or a fixed preset pool size.
#
# Version: 1.0
# Status: specification_only — no maps generated until batch pipeline runs
# ===========================================================================

map_design_space_saturation_v1:
  version: 1.0
  status: specification_only

  methodology:
    completeness_claim: declared_topology_space_only
    stop_criterion: feature_space_saturation
    citation_ready: >
      Map generation stopped at N candidates because coverage of the declared
      map-topology feature space reached saturation under the defined metrics
      and stop rule. Completeness is defined with respect to this declared
      design space, not with respect to all possible real-world environments.

  feature_space:
    feature_set_id: map_topology_saturation_v1
    normalization: zscore_per_feature
    features:
      - n_nodes
      - n_edges
      - total_road_length_m
      - road_density
      - world_area
      - useful_area_ratio
      - avg_degree
      - dead_end_ratio
      - n_components
      - largest_component_ratio
      - bridge_edges
      - articulation_points
      - orientation_entropy
      - gridness_score
      - corridor_score
      - radial_score
      - partition_score
      - community_score
      - graph_diameter_approx
      - avg_shortest_path_approx
      - circuity_approx
      - source_type
      - anchor_id
      - archetype

  # =========================================================================
  # A. REAL ANCHORS
