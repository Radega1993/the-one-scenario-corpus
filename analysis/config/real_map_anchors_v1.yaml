        east: 24.535
      crs: EPSG:3067
      network_type: all
      expected_use: [rural, trails, sparse]
      legacy_map_id: NuuksioSparseTrails

    # ── NYC / taxi literature ─────────────────────────────────────────────
    - anchor_id: manhattan_midtown
      label: Manhattan Midtown
      source_context: NYC taxi / grid urban vehicular
      dataset_basis: Manhattan / NYC Taxi reference; legacy ManhattanMidtownGrid
      anchor_type: osm_bbox
      archetype: urban_grid
      country: USA
      bbox:
        south: 40.748
        north: 40.766
        west: -73.993
        east: -73.968
      crs: EPSG:32618
