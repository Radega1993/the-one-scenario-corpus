# ===========================================================================
# real_map_anchors_v1.yaml
# ===========================================================================
# Literature- and dataset-grounded anchors for map_space_v1 generation.
# Not all anchors are downloadable OSM maps — see anchor_type.
# ===========================================================================

real_map_anchors_v1:
  version: 1.0
  description: |
    Real-world and literature anchors for The ONE map-topology design space.
    OSM anchors use documented bboxes; trace-only anchors parameterize synthetics.

  anchors:
    # ── Helsinki tradition (The ONE / DTN literature) ─────────────────────
    - anchor_id: helsinki_downtown
      label: Helsinki Downtown
      source_context: The ONE / Helsinki urban tradition
      dataset_basis: Helsinki map-based scenarios; legacy HelsinkiDowntown
      anchor_type: osm_bbox
      archetype: dense_urban_irregular
      country: Finland
      bbox:
        south: 60.165
        north: 60.178
        west: 24.925
        east: 24.955
      crs: EPSG:3067
      network_type: drive
      expected_use: [urban, wdm, pedestrian_bus]
      legacy_map_id: HelsinkiDowntown

    - anchor_id: kumpula_campus
      label: Kumpula Campus
      source_context: University of Helsinki Kumpula
      dataset_basis: The ONE campus scenarios; legacy KumpulaCampus
      anchor_type: osm_bbox
      archetype: campus_compact
      country: Finland
      bbox:
        south: 60.2025
        north: 60.2115
        west: 24.958
        east: 24.978
      crs: EPSG:3067
      network_type: all
      expected_use: [campus, pedestrian, compact]
      legacy_map_id: KumpulaCampus

    - anchor_id: kallio_community
      label: Kallio Community Compact
      source_context: Helsinki Kallio residential / social DTN
      dataset_basis: legacy KallioCommunityCompact
      anchor_type: osm_bbox
      archetype: compact_residential
      country: Finland
      bbox:
        south: 60.179
        north: 60.189
        west: 24.938
        east: 24.957
      crs: EPSG:3067
      network_type: all
      expected_use: [social, cluster, compact_pedestrian]
      legacy_map_id: KallioCommunityCompact

    - anchor_id: helsinki_disrupted
      label: Helsinki Kalasatama / Disrupted
      source_context: Industrial harbour / disaster modelling
      dataset_basis: legacy HelsinkiDisrupted
      anchor_type: osm_bbox
      archetype: industrial_disrupted
      country: Finland
      bbox:
        south: 60.180
        north: 60.196
        west: 24.965
        east: 24.995
      crs: EPSG:3067
      network_type: all
      expected_use: [disaster, partitioned, vehicle]
      legacy_map_id: HelsinkiDisrupted

    - anchor_id: nuuksio_sparse_trails
      label: Nuuksio Sparse Trails
      source_context: Finnish national park trail networks
      dataset_basis: legacy NuuksioSparseTrails
