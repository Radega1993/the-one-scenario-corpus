    - anchor_id: rollernet_trace
      label: RollerNet contact trace
      source_context: RollerNet DTN traces
      dataset_basis: contact_trace_only
      anchor_type: trace_reference_not_map
      archetype: corridor
      country: unknown
      bbox: null
      crs: local
      network_type: synthetic
      expected_use: [sparse, mobile, corridor_like]
      notes: Contact trace; parametrizes corridor / sparse synthetic topology.

    - anchor_id: haggle_contacts_only
      label: Haggle (contacts only)
      source_context: Haggle iMote traces without reliable venue map
      dataset_basis: contact_trace_only
      anchor_type: trace_reference_not_map
      archetype: clustered_communities
      country: UK
      bbox: null
      crs: local
      network_type: synthetic
      expected_use: [social, cluster]
      notes: |
        Cambridge OSM anchor (cambridge_haggle) provides geographic map;
        this anchor parametrizes social-cluster synthetics from contact density.

