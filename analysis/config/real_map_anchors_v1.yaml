        north: 42.365
        west: -71.095
        east: -71.085
      crs: EPSG:32619
      network_type: all
      expected_use: [campus, social, pedestrian]

    # ── Contact traces — NOT direct OSM maps ──────────────────────────────
    - anchor_id: infocom_event_compact
      label: INFOCOM-style conference event
      source_context: INFOCOM 2005 / iMote contact trace (Infocom5)
      dataset_basis: contact_trace_only
      anchor_type: trace_reference_not_map
      archetype: conference_event_compact
      country: unknown_or_dataset_dependent
      bbox: null
      crs: local
      network_type: synthetic
      expected_use: [event, social_dense, compact_pedestrian]
      notes: |
        INFOCOM/Info5 is a contact trace reference, not a directly downloadable map.
        Use to parameterize compact event synthetic maps (conference_event_compact).

    - anchor_id: infocom_2006_trace
      label: INFOCOM 2006 contact trace
      source_context: INFOCOM 2006 conference traces
      dataset_basis: contact_trace_only
      anchor_type: trace_reference_not_map
      archetype: conference_event_compact
      country: unknown_or_dataset_dependent
      bbox: null
      crs: local
      network_type: synthetic
      expected_use: [event, social_dense]
