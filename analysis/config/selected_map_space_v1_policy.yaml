selected_map_space_v1:
  input_pool:
    max_batch_target: 1200
    allowed_status:
      - PASS
      - WARNING
      - STRESS
    exclude_status:
      - FAIL

  feature_space:
    use_normalized_features: true
    exclude_columns:
      - map_id
      - archetype
      - anchor_id
      - generator_type
      - source_type
      - batch_target
    include_source_type_one_hot: true
    include_topology_features: true

  selection_methods:
    - kmedoids
    - farthest_point_sampling
    - epsilon_cover
    - stratified_kmedoids
    - hybrid_stratified_diversity

  target_sizes:
    - 30
    - 45
    - 60
    - 75
    - 90
    - 120

  epsilon_grid:
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.50

  constraints:
    min_maps_per_archetype: 2
    preferred_min_maps_per_archetype: 3
    min_osm_fraction: 0.25
    max_osm_fraction: 0.60
    min_synthetic_fraction: 0.25
    min_trace_reference_synthetic_fraction: 0.05
    max_single_archetype_fraction: 0.15
    max_single_anchor_fraction: 0.10
    preserve_topological_outliers: true

  evaluation_metrics:
    - max_distance_to_selected
    - mean_distance_to_selected
    - median_distance_to_selected
    - p95_distance_to_selected
    - archetype_coverage
    - source_type_coverage
    - anchor_coverage
    - outlier_preservation
    - redundancy_within_selected
    - pairwise_distance_distribution

  official_selection:
    prefer_method: hybrid_stratified_diversity
    fallback_method: stratified_kmedoids
    elbow_marginal_improvement_threshold: 0.05
    choose_by:
      - coverage_elbow
      - max_distance_reduction
      - constraints_satisfied
      - reviewer_explainability
