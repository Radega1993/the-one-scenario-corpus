# ===========================================================================
# map_asset_policy_v1.yaml
# ===========================================================================
# Conditional POI and route generation for map_space_v1.
# Not all maps need WDM POIs or bus routes.
# ===========================================================================

map_asset_policy_v1:
  version: 1.0

  asset_policy:
    generate_pois:
      only_for_archetypes:
        - dense_urban_irregular
        - campus_compact
        - compact_residential
        - conference_event_compact
      only_for_expected_use:
        - wdm
        - wdm_capable
        - campus
        - event
      poi_files:
        - A_homes.wkt
        - A_offices.wkt
        - A_meetingspots.wkt
      snap_max_m: 500
      notes: POIs must snap to road graph nodes.

    generate_routes:
      only_for_archetypes:
        - urban_grid
        - bus_route_urban_suburban
        - corridor_linear
        - corridor
        - industrial_disrupted
        - rural_roads
        - sparse_trails
      only_for_expected_use:
        - vehicle
        - bus_routes
        - bus_route
        - corridor
        - rural_patrol
        - disaster_bridge
      route_files:
        bus: A_bus.wkt
        vehicle: A_vehicle_route.wkt
        patrol: A_ranger_patrol.wkt
        emergency: A_emergency_route.wkt
      validation:
        min_route_length_m: 200
        max_snap_distance_m: 50
        require_resolvable_path: true
        require_within_world_size: true

    skip_assets_for:
      source_types:
        - trace_reference_synthetic
      archetypes:
        - sparse_rural
        - tree_trails
        - hub_and_spoke
        - radial_city
      unless_expected_use:
        - wdm
        - vehicle
        - bus_routes

  wdm_capable_archetypes:
    - dense_urban_irregular
    - campus_compact
    - compact_residential
    - conference_event_compact

  movement_compatibility:
    WorkingDayMovement:
      requires: [A_homes.wkt, A_offices.wkt, A_meetingspots.wkt]
    BusMovement:
      requires_any: [A_bus.wkt, A_vehicle_route.wkt]
    MapRouteMovement:
      requires_any: [A_vehicle_route.wkt, A_bus.wkt, A_ranger_patrol.wkt, A_emergency_route.wkt]
    ShortestPathMapBasedMovement:
      requires: [roads.wkt]
