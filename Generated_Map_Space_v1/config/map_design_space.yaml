map_design_space_revised_v2:
  schema_version: '2.0'
  design_space_version: revised_v2
  status: generation_enabled
  baseline_reference:
    config: scenarios/_archive/map_space_phase1_baseline/config/map_design_space_saturation_v1.yaml
    output_pool: scenarios/_archive/map_space_phase1_baseline/map_space_saturation_v1/
    note: Baseline Phase-1 archived (frozen). Do not overwrite. Not used for GMS-v1.
  methodology:
    completeness_claim: declared_topology_space_only
    stop_criterion: feature_space_saturation_deferred
    citation_ready: 'The map-generation pipeline explicitly combines three evidence and construction sources:
      OSM-derived geometries, real-trace-supported references, and controlled synthetic generators. Real
      traces are not treated as maps by default; each trace is assigned an explicit generation role.'
  base_archetypes:
  - urban_grid
  - dense_urban_irregular
  - campus_compact
  - compact_residential
  - corridor_linear
  - bus_route_urban_suburban
  - radial_city
  - hub_and_spoke
  - sparse_trails
  - rural_roads
  - industrial_disrupted
  - island_or_partitioned
  - conference_event_compact
  - clustered_communities
  - suburban_low_density
  source_types:
    allowed:
    - osm
    - synthetic
    - trace_reference_synthetic
    rejected_for_now:
      trace_derived_geometry: Would require defendable trajectory→road geometry rule; none enabled.
      trace_anchored_osm: Redundant with source_type=osm + provenance.trace_support from role osm_anchor_support.
    definitions:
      osm: Geometry downloaded/converted from OpenStreetMap for a configured geographic anchor.
      synthetic: Geometry from a controlled procedural generator with no trace_id.
      trace_reference_synthetic: Geometry from a procedural generator parameterized by (or linked to)
        a real trace; provenance includes trace_id and extracted_parameters.
  paths:
    output_root: scenarios/Generated_Map_Space_v1
    plan_csv: scenarios/Generated_Map_Space_v1/data/map_generation_plan_v2.csv
    plan_md: scenarios/Generated_Map_Space_v1/docs/map_generation_v2_dry_run.md
    trace_inventory: scenarios/Generated_Map_Space_v1/downloaded_external_traces/registry/real_trace_inventory_v1.csv
    trace_policy: scenarios/Generated_Map_Space_v1/config/trace_to_map_generation_policy.yaml
    trace_matrix: scenarios/Generated_Map_Space_v1/data/trace_to_archetype_generation_matrix_v1.csv
    archetype_definitions: scenarios/Generated_Map_Space_v1/data/map_archetype_definitions_v1.csv
    archetype_source_allocation: scenarios/Generated_Map_Space_v1/config/archetype_source_allocation.yaml
  seed_policy:
    global_seed_default: 42
    function: sha256
    candidate_seed_formula: sha256(global_seed::map_id::archetype::source_type::trace_id::generator_type)[:8] as int
    synthetic_attempt_formula: sha256(global_seed::planned_map_id::param_hash::attempt)[:8] as int
    note: >
      Seed 42 is not scientifically optimized; it makes stochastic generation
      deterministic and auditable. Candidate seeds bind map_id plus archetype,
      source_type, trace_id, and generator_type so inserting another candidate
      does not change seeds of existing maps with the same identity fields.
  dry_run_policy:
    allow_network: false
    allow_wkt_write: false
    allow_raw_trace_copy: false
    write_plan: true
    fail_on_critical: true
  validation_policy:
    require_all_archetypes_covered: true
    require_all_source_types_present: true
    require_enabled_traces_have_extractor_or_static: true
    require_archetype_source_matrix: true
    min_nodes_synthetic: 20
    min_edges_synthetic: 20
  planning:
    target_total_default: 2000
    target_total_role: balanced_expansion_after_saturation
    target_total_note: >
      Expanded from 1600 after stratified re-saturation decision BALANCED_2000.
      Soft fractions 0.45/0.40/0.15; +400 ≈ 180 OSM + 160 synthetic + 60 TRS.
      Final stop still via saturation evidence, not assumed at 2000.
    saturation_batch_ladder:
    - 100
    - 200
    - 400
    - 600
    - 800
    - 1000
    - 1200
    - 1600
    - 2000
    osm_fraction: 0.45
    synthetic_fraction: 0.4
    trace_reference_fraction: 0.15
    fraction_role: soft_engineering_targets
    fraction_note: >
      Soft targets derived from / checked against archetype_source_allocation_v2;
      not a methodological stopping rule. Planner must respect matrix roles (none forbidden).
    ensure_minimum_coverage: true
    variants_per_osm_anchor: 2
    variants_per_generator: 2
    batch_targets:
    - 100
    - 200
    - 400
    - 600
    - 800
    - 1000
    - 1200
    - 1600
    - 2000
  osm_generation_policy:
    anchor_types_allowed:
    - osm_bbox
    - osm_place
    forbidden: random_bbox_without_anchor
    variant_types:
    - exact
    - offset_n
    - offset_e
    - offset_s
    - offset_w
    window_sizes_m:
    - 500
    - 1000
    - 1500
    - 2500
    - 5000
    offset_distances_m:
    - 0
    - 200
    - 500
    - 1000
    - 1500
    max_offset_from_anchor_m: 2000
    cache_subdir: osm_cache
    required_metadata_fields:
    - anchor_id
    - window_size_m
    - variant_type
    - center_lat
    - center_lon
    - crs
    - network_type
    - seed
    - config_hash
    - builder
    - source_type
    - archetype
