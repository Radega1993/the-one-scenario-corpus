# Trace → map generation policy v1
# Each registered real trace has an explicit generation role.
# Roles are NOT source_types. Source types remain: osm | synthetic | trace_reference_synthetic.
#
# Roles:
#   evidence_only | osm_anchor_support | parameterize_generator | trace_reference_synthetic
#   | direct_trace_geometry | unsupported_for_generation | future_candidate

trace_to_map_generation_policy_v1:
  schema_version: "1.0"
  inventory_path: scenarios/Generated_Map_Space_v1/downloaded_external_traces/registry/real_trace_inventory_v1.csv
  notes: |
    Enabled parameterize traces must declare parameter_extractor.
    static_parameters_v1 values are provisional literature/README-grounded defaults,
    not silent inventions from unparsed archives. They exist so the planner can
    demonstrate an explicit trace→generator link before full parsers land.

  traces:
    - trace_id: haggle_one_cambridge_city_complete
      enabled: true
      primary_or_supporting: primary
      generation_role: parameterize_generator
      target_archetypes: [clustered_communities, conference_event_compact]
      target_generators: [clustered_communities, conference_event_compact]
      target_osm_anchors: [cambridge_haggle]
      required_files:
        - scenarios/Generated_Map_Space_v1/downloaded_external_traces/processed/the_one/uoi_haggle_20160828/haggle_one_cambridge_city_complete/events.tsv
      parameter_extractor: standard_events_contact_summary_v1
      events_path: scenarios/Generated_Map_Space_v1/downloaded_external_traces/processed/the_one/uoi_haggle_20160828/haggle_one_cambridge_city_complete/events.tsv
      fallback_policy: fail
      notes: Validated StandardEventsReader; produces trace_reference_synthetic candidates.

    - trace_id: cambridge_haggle_20090529
      enabled: false
      primary_or_supporting: supporting
      generation_role: evidence_only
      target_archetypes: [clustered_communities, conference_event_compact, dense_urban_irregular]
      target_generators: []
      target_osm_anchors: [cambridge_haggle]
      required_files: []
      parameter_extractor: metadata_only_v1
      fallback_policy: skip
      notes: Source CRAWDAD package for Haggle ONE conversion; not a separate generator input.

    - trace_id: cambridge_haggle_20060915
      enabled: false
      primary_or_supporting: supporting
      generation_role: evidence_only
      target_archetypes: [clustered_communities, conference_event_compact]
      target_generators: []
      target_osm_anchors: [cambridge_haggle]
      required_files: []
      parameter_extractor: metadata_only_v1
      fallback_policy: skip
      notes: Historical Haggle snapshot.

    - trace_id: cambridge_haggle_20060131
      enabled: false
      primary_or_supporting: supporting
      generation_role: evidence_only
      target_archetypes: [clustered_communities, conference_event_compact]
      target_generators: []
      target_osm_anchors: [cambridge_haggle]
      required_files: []
      parameter_extractor: metadata_only_v1
      fallback_policy: skip
      notes: Historical Haggle snapshot.

    - trace_id: upmc_rollernet_20090202
      enabled: true
      primary_or_supporting: primary
      generation_role: parameterize_generator
      target_archetypes: [corridor_linear]
      target_generators: [corridor]
      target_osm_anchors: []
      required_files:
        - scenarios/Generated_Map_Space_v1/downloaded_external_traces/raw/crawdad/upmc_rollernet_20090202/imote-traces-RollerNet.tar.gz
      parameter_extractor: rollernet_contacts_v1
      archive_path: scenarios/Generated_Map_Space_v1/downloaded_external_traces/raw/crawdad/upmc_rollernet_20090202/imote-traces-RollerNet.tar.gz
